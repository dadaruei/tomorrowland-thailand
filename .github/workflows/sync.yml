
name: Sync public itinerary

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Google Sheets itinerary
        env:
          FEED_URL: ${{ secrets.PUBLIC_ITINERARY_FEED_URL }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request

          url = os.environ.get('FEED_URL')
          if not url:
              raise SystemExit('Missing PUBLIC_ITINERARY_FEED_URL')

          request = urllib.request.Request(
              url,
              headers={'User-Agent': 'tml-journey-sync/1.0'}
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              data = json.load(response)

          days = data.get('days', [])
          if len(days) != 9:
              raise SystemExit('Expected 9 days; refusing update')

          with open('data.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          PY

      - name: Commit refreshed itinerary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update public itinerary"
            git push
          fi
