<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>Our Journey · Tomorrowland Thailand 2026</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#172239;--panel2:#202e48;--gold:#e8c78d;--muted:#b2bfd2;--line:#34415a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -5%,#263a5b,#0b1220 46%);color:#f6f5f1;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}main{max-width:720px;margin:auto;padding:24px 17px 90px}header{text-align:center;padding:25px 0 15px}.eyebrow{font-size:11px;letter-spacing:3px;color:var(--gold)}h1{font-family:Georgia,serif;font-size:clamp(27px,7vw,44px);letter-spacing:1px;margin:13px 0 8px}header p{color:var(--muted);font-size:13px}.hero{background:linear-gradient(125deg,#253755,#121d31);border:1px solid #42516b;border-radius:22px;padding:22px;margin:18px 0;box-shadow:0 10px 40px #0003}.hero .count{font-size:33px;font-weight:700;color:var(--gold)}.hero small{color:var(--muted)}.dates{display:flex;gap:8px;overflow:auto;padding:8px 0 15px;scrollbar-width:none}.dates button{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:#fff;min-width:67px;padding:12px 9px;cursor:pointer}.dates button.active{background:var(--gold);color:#151b26;border-color:var(--gold)}.dates strong,.dates small{display:block}.dates small{margin-top:5px;opacity:.75}h2{font-size:22px;margin:18px 0 6px}.sub{color:var(--muted);font-size:13px;margin:0 0 18px}.timeline{border-left:1px solid #485775;margin-left:15px;padding-left:20px}.event{position:relative;background:var(--panel);border:1px solid #2d3b54;border-radius:16px;margin:0 0 13px;padding:16px}.event:before{content:"";position:absolute;left:-27px;top:21px;width:11px;height:11px;background:var(--gold);border-radius:50%;box-shadow:0 0 0 4px var(--bg)}.event .time{color:var(--gold);font-size:13px;font-weight:700}.event h3{font-size:16px;margin:7px 0}.event p{color:var(--muted);font-size:13px;line-height:1.65;margin:8px 0}.tag{font-size:11px;border:1px solid #56647b;color:#cbd5e3;border-radius:99px;padding:3px 9px;display:inline-block}.tag.confirmed{color:#a9e8ca;border-color:#43876b}.tag.verify{color:#ffcf93;border-color:#99734d}.map{color:var(--gold);font-size:13px;text-decoration:none;display:inline-block;margin-top:9px}.toolbar{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:15px 0}.toolbar button{background:#273650;color:#fff;border:1px solid #42516b;border-radius:12px;padding:9px 13px;cursor:pointer}.notice{border:1px solid #725d40;background:#33291f;color:#f1d8af;padding:12px;border-radius:12px;font-size:12px;line-height:1.7;margin:14px 0}footer{text-align:center;color:#8290a7;font-size:12px;padding:20px 0}.hidden{display:none}@media(min-width:640px){main{padding:30px}}
</style></head><body><main><header><div class="eyebrow">THAILAND · DEC 09 — 17</div><h1>OUR JOURNEY</h1><p>Tomorrowland Thailand 2026 · 9 Days, 8 Nights</p></header><section class="hero"><small>COUNTDOWN TO OUR ADVENTURE</small><div class="count" id="countdown">—</div><small>Bangkok · Rayong · Wisdom Valley</small></section><div class="toolbar"><span id="updated" class="sub">載入中…</span><button id="today">查看今天</button></div><nav class="dates" id="dates" aria-label="選擇日期"></nav><h2 id="dayTitle"></h2><p class="sub" id="daySubtitle"></p><div class="notice">⚠️ 這是團員行程規劃頁；標示「待核實」的活動時間、接駁或訂位請以官方／主辦／店家最新通知為準。</div><section class="timeline" id="events"></section><footer>Made for our Tomorrowland crew ✦<p>不包含私人航班乘客資料、訂單編號及拆帳資料</p></footer></main><script>
const labels={confirmed:'表格標示已確認',planned:'規劃中',verify:'待核實'};let data=null,selected=0;const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){const d=data.days[selected];$('dates').innerHTML=data.days.map((v,i)=>`<button class="${i===selected?'active':''}" data-i="${i}"><strong>${v.date.slice(5).replace('-','/')}</strong><small>DAY ${i+1}</small></button>`).join('');$('dates').querySelectorAll('button').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.i);render()});$('dayTitle').textContent=`DAY ${selected+1} · ${d.city}`;$('daySubtitle').textContent=d.theme;$('events').innerHTML=d.events.map(e=>`<article class="event"><div class="time">${esc(e.time)}</div><h3>${esc(e.title)}</h3><span class="tag ${esc(e.status)}">${labels[e.status]||'規劃中'}</span>${e.note?`<p>${esc(e.note)}</p>`:''}${e.map?`<a class="map" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(e.map)}">開啟 Google Maps ↗</a>`:''}</article>`).join('')};function countdown(){const diff=new Date('2026-12-09T00:00:00+07:00')-Date.now();$('countdown').textContent=diff>0?`${Math.ceil(diff/86400000)} DAYS TO GO`:'THE JOURNEY IS HERE ✦'}async function load(){try{const r=await fetch('data.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('讀取失敗');data=await r.json();$('updated').textContent=`行程資料更新：${data.updated||'未標示'}`;render()}catch(e){$('updated').textContent='資料載入失敗，請重新整理';$('events').textContent=e.message}}$('today').onclick=()=>{if(!data)return;const today=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());selected=Math.max(0,data.days.findIndex(d=>d.date===today));render()};countdown();setInterval(countdown,60000);load();setInterval(load,300000);
</script></body></html>
